<section class="custom-stay custom-stay-standalone"><div class="custom-stay-inner">
<p class="eyebrow green">FOR PROPERTY OWNERS</p><h1>Tell Us About Your Property</h1>
<p>Interested in professional vacation-rental management? Tell us about your property and what you would like help with.</p>
<form class="custom-stay-form contact-request-form" data-inquiry="Property Management Inquiry" action="https://formspree.io/f/xaeqykbv" method="POST">
<div class="custom-field"><label>Name</label><input name="name" type="text" autocomplete="name" required></div>
<div class="custom-field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>
<div class="custom-field"><label>Phone</label><input name="phone" type="tel" autocomplete="tel"></div>
<div class="custom-field"><label>Property Location</label><input name="location" type="text" required></div>
<div class="custom-field"><label>Property Type</label><select name="propertyType"><option>Chalet / Vacation Home</option><option>Waterfront Cottage</option><option>Condo</option><option>Other</option></select></div>
<div class="custom-field"><label>Bedrooms</label><input name="bedrooms" type="number" min="1"></div>
<div class="custom-field"><label>Currently a Vacation Rental?</label><select name="operating"><option>Yes</option><option>No</option><option>Preparing to launch</option></select></div>
<div class="custom-field"><label>What Help Are You Looking For?</label><select name="service"><option>Full-Service Property Management</option><option>Professional Design &amp; Setup</option><option>Revenue Management</option><option>Property Setup + Management</option><option>Other</option></select></div>
<div class="custom-field custom-full"><label>Tell Us About Your Property</label><textarea name="message" rows="5" placeholder="Anything else we should know?"></textarea></div>
<button class="btn dark custom-submit" type="submit">Send Management Inquiry</button>
<p class="custom-form-note">Submit this form and your inquiry will be sent directly to Zyen Homes.</p>
