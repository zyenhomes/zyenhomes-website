opacity:.25;cursor:not-allowed}.zy-calendar-day.zy-selected{background:#174f41;color:white}.zy-calendar-day.zy-between{background:#e2f0e9}.zy-calendar-hint{font-size:13px;color:#536d61;margin:0 0 10px}.zy-calendar-close{margin-top:10px;border:0;background:transparent;color:#174f41;text-decoration:underline;cursor:pointer}@media(max-width:550px){.zy-calendar{position:fixed;left:14px!important;top:50%!important;transform:translateY(-50%);width:calc(100vw - 28px);max-height:90vh;overflow:auto}}</style></head><body><header class="site-header"><a class="brand brand-logo" href="index.html"><img src="Zyen Homes Logo(2).webp" alt="Zyen Homes"></a><nav><a href="index.html">Home</a><a href="rentals.html">All Properties</a><a href="custom-stay.html">Custom Stay</a></nav></header><main class="zy-wrap"><div class="zy-intro"><h1 class="zy-title">Explore All Properties</h1></div><form id="filters" class="zy-form"><label>Check-in<input type="text" name="checkin" placeholder="Select check-in" readonly aria-haspopup="dialog" autocomplete="off"></label><label>Check-out<input type="text" name="checkout" placeholder="Select check-out" readonly aria-haspopup="dialog" autocomplete="off"></label><label>Guests<input type="number" name="guests" min="1" value="2"></label><button class="zy-button" type="submit">Find Properties</button></form><div class="zy-notice">Map results are filtered by guest capacity, not confirmed live availability. Check Guesty for booking availability.</div><div class="zy-map-layout"><section class="zy-results-panel"><div class="zy-results-heading"><h2>Vacation Rentals</h2><button id="reset-map" type="button">Show all</button></div><p id="count" class="zy-muted"></p><div id="results" class="zy-grid"></div></section><aside class="zy-map-panel"><div id="property-map" role="region" aria-label="Map of Zyen Homes vacation rentals"></div><p class="zy-map-help">Zoom or move the map to filter properties on the left.</p></aside></div></main><footer class="zy-foot">Zyen Homes Property Management · <a href="mailto:info@zyenhomes.com">Contact Us</a></footer><script src="properties-data.js?v=20261023-snowbridge39"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const f=document.querySelector('#filters');
const params=new URLSearchParams(location.search);
for(const k of ['checkin','checkout','guests'])if(params.has(k))f.elements[k].value=params.get(k);
const today=new Date().toISOString().slice(0,10);

const map=L.map('property-map',{scrollWheelZoom:false}).setView([44.3,-80.0],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const locations=new Map();
const markers=L.featureGroup().addTo(map);
let mapReady=false;
const addresses={
'116-tyrolean':'116 Tyrolean Lane, The Blue Mountains, Ontario, Canada',
'105-pilsen':'105 Pilsen Way, The Blue Mountains, Ontario, Canada',
'37-snowbridge':'37-171 Snowbridge Way, The Blue Mountains, Ontario, Canada',
'109-plater':'109 Plater Street, The Blue Mountains, Ontario, Canada',
'147-campbell':'147 Campbell Crescent, The Blue Mountains, Ontario, Canada',
'940-seven-oaks':'940 Seven Oaks Dr, Bailieboro, ON K0L 1B0, Canada',
'873235-5th-line-ehs':'873235 5th Line EHS, Mono, Ontario, Canada'
};
function eligible(x){
 const guests=Math.max(1,Number(f.elements.guests.value)||1);
 return x.guests>=guests;
}
function render(){
 const visible=ZYEN_PROPERTIES.filter(x=>{
  if(!eligible(x))return false;
  if(!mapReady)return true;
  const pos=locations.get(x.id);
  return !pos || map.getBounds().contains(pos);
 });
 document.getElementById('count').textContent=visible.length+' propert'+(visible.length===1?'y':'ies')+' in this area for your group';
 document.getElementById('results').innerHTML=visible.map(x=>{
  const query=new URLSearchParams({checkin:f.elements.checkin.value,checkout:f.elements.checkout.value,guests:f.elements.guests.value||2});
  const url='property.html?id='+encodeURIComponent(x.id)+'&'+query;
  return '<article class="zy-card"><a href="'+url+'"><img loading="lazy" decoding="async" src="'+encodeURI(x.image)+'" alt="'+x.name+'"></a><div class="zy-card-body"><p class="zy-tag">'+x.location+'</p><h2>'+x.name+'</h2><p class="zy-muted">'+x.beds+' bedrooms · '+x.baths+' bathrooms · Sleeps '+x.guests+'</p><p>'+x.feature+'</p>'+'<div class="zy-live-card-price" data-price-id="'+x.id+'" aria-live="polite"></div><a class="zy-button" href="'+url+'">View Property →</a></div></article>';
 }).join('')||'<p>No matching properties in this map area. Zoom out or select Show all.</p>';
 if (typeof window.zyUpdateQuoteCards === 'function') window.zyUpdateQuoteCards();
 markers.eachLayer(marker=>{const x=ZYEN_PROPERTIES.find(home=>home.id===marker.options.propertyId);if(x)marker.setOpacity(eligible(x)?1:0.3)});
}
map.on('moveend',()=>{mapReady=true;render()});
document.getElementById('reset-map').addEventListener('click',()=>{if(markers.getLayers().length)map.fitBounds(markers.getBounds().pad(.3),{maxZoom:11});else map.setView([44.3,-80],8);});
f.addEventListener('submit',event=>{
 event.preventDefault();
 if(f.elements.checkin.value&&f.elements.checkout.value&&f.elements.checkout.value<=f.elements.checkin.value){alert('Check-out must be after check-in.');return}
 const query=new URLSearchParams(new FormData(f));history.replaceState(null,'','?'+query);render();
});
render();
async function locateProperties(){
 // Public OpenStreetMap geocoding, paced to respect its usage policy.
 for(const home of ZYEN_PROPERTIES){
  try{
   const query=addresses[home.id];
   if(!query)continue;
   const response=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(query),{headers:{'Accept':'application/json'}});
   if(!response.ok)throw new Error('Geocoding unavailable');
   const data=await response.json();
   // Some rural street addresses are missing from OpenStreetMap.
   // Use an approximate Bailieboro-area marker if this address cannot be found.
   const approximate=home.id==='940-seven-oaks' && !data.length;
   const pos=data.length
    ? L.latLng(Number(data[0].lat),Number(data[0].lon))
    : approximate ? L.latLng(44.13223,-78.35351) : null;
   if(pos){
    locations.set(home.id,pos);
    const marker=L.marker(pos,{propertyId:home.id}).addTo(markers);
    const link='property.html?id='+encodeURIComponent(home.id);
    const popup=document.createElement('div');
    const title=document.createElement('strong');title.textContent=home.name;popup.append(title,document.createElement('br'));
    if(approximate){const note=document.createElement('small');note.textContent='Approximate Bailieboro area (not exact property location)';popup.append(note,document.createElement('br'));}
    const anchor=document.createElement('a');anchor.href=link;anchor.textContent='View property →';popup.append(anchor);
    marker.bindPopup(popup);
   }
  }catch(error){console.warn('Unable to locate',home.name,error);if(home.id==='940-seven-oaks'){const pos=L.latLng(44.13223,-78.35351);locations.set(home.id,pos);const marker=L.marker(pos,{propertyId:home.id}).addTo(markers);marker.bindPopup('<strong>940 Seven Oaks Drive</strong><br><small>Approximate Bailieboro area</small><br><a href="property.html?id=940-seven-oaks">View property →</a>');}}
  await new Promise(resolve=>setTimeout(resolve,1100));
 }
 if(markers.getLayers().length){
  map.fitBounds(markers.getBounds().pad(.3),{maxZoom:11});
  mapReady=true;render();
 }else document.querySelector('.zy-map-help').textContent='Map locations are temporarily unavailable. All properties are listed on the left.';
}
locateProperties();
</script><script src="zyen-all-pricing.js?v=20261027-autosearch-2" defer></script><script src="zyen-range-calendar.js?v=20261027-1" defer></script></body></html>
