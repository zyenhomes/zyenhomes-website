<body class="custom-stay-page"><header class="site-header custom-page-header">
<a class="brand brand-logo" href="index.html" aria-label="Zyen Homes Property Management"><img src="Zyen Homes Logo(2).jpg" alt="Zyen Homes Property Management"></a>

<section class="custom-stay custom-stay-standalone"><div class="custom-stay-inner">
<p class="eyebrow green">BLUE MOUNTAIN SKI COMMUNITY</p>
<h1>Join the Ski Community</h1>
<p>Looking for a social midweek stay near Blue Mountain? Tell us about your preferred dates and whether you're travelling individually or as a couple.</p>
<form class="custom-stay-form contact-request-form" data-inquiry="Ski Community Inquiry" action="https://formspree.io/f/xaeqykbv" method="POST">
<div class="custom-field custom-full"><label>Who Will Be Staying?</label><select name="stayType" required><option value="">Select one</option><option>Individual — 1 Guest</option><option>Couple — 2 Guests</option></select></div>
<div class="custom-field"><label>Check-in</label><input name="checkin" type="date" required></div>
<div class="custom-field"><label>Check-out</label><input name="checkout" type="date" required></div>
<div class="custom-field"><label>Activity</label><select name="activity"><option>Skiing</option><option>Snowboarding</option><option>Both</option></select></div>
<div class="custom-field"><label>Experience Level</label><select name="experience"><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>Prefer not to say</option></select></div>
<div class="custom-field"><label>Name</label><input name="name" type="text" autocomplete="name" required></div>
<div class="custom-field"><label>Email</label><input name="email" type="email" autocomplete="email" required></div>
<div class="custom-field custom-full"><label>Phone</label><input name="phone" type="tel" autocomplete="tel"></div>
<div class="custom-field custom-full"><label>Questions or Special Requests</label><textarea name="message" rows="5" placeholder="Anything else you'd like us to know?"></textarea></div>
<button class="btn dark custom-submit" type="submit">Send Ski Community Inquiry</button>
<p class="custom-form-note">Submit this form and your inquiry will be sent directly to Zyen Homes.</p>
</form></div></section></main>
