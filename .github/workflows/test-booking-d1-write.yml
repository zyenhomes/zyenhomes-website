name: Test Booking D1 Write and Cleanup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zyenhomes-booking-d1-write-test
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Validate account ID
        env:
          RAW_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e '
            import {appendFileSync} from "node:fs";
            const id=(process.env.RAW_ACCOUNT_ID||"").trim();
            if(!/^[0-9a-fA-F]{32}$/.test(id))process.exit(1);
            appendFileSync(process.env.GITHUB_ENV,"CLOUDFLARE_ACCOUNT_ID="+id+"\n");
          '
      - name: Insert and verify synthetic booking request
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          ID="zyen-d1-synthetic-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "SYNTHETIC_REQUEST_ID=$ID" >> "$GITHUB_ENV"
          W="../node_modules/.bin/wrangler"
          SQL="INSERT INTO booking_requests (request_id,property_id,guest_name,guest_email,guest_phone,check_in,check_out,guests,message,quote_total_cents,quote_currency,marketing_consent,request_status,guesty_sync_status) VALUES ('$ID','105-pilsen','Synthetic Test','synthetic@example.invalid','0000000000','2099-01-01','2099-01-03',2,'Automated storage test; not a booking',10000,'CAD',0,'test','not_requested');"
          "$W" d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "$SQL"
          CHECK="SELECT CASE WHEN COUNT(*)=1 AND MAX(marketing_consent)=0 AND MAX(guesty_sync_status)='not_requested' AND MAX(guests)=2 AND MAX(quote_total_cents)=10000 THEN 'PASS' ELSE 'FAIL' END AS verification FROM booking_requests WHERE request_id='$ID';"
          "$W" d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "$CHECK" --json > /tmp/d1-check.json
          node -e 'const d=require("/tmp/d1-check.json"); const text=JSON.stringify(d); if(!text.includes("\\"PASS\\"")){console.error("D1 verification failed");process.exit(1)}console.log("Synthetic record verified; marketing consent is false.");'
      - name: Always remove synthetic record
        if: always() && env.SYNTHETIC_REQUEST_ID != ''
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "DELETE FROM booking_requests WHERE request_id='${SYNTHETIC_REQUEST_ID}' AND guest_email='synthetic@example.invalid';"
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "SELECT COUNT(*) AS remaining FROM booking_requests WHERE request_id='${SYNTHETIC_REQUEST_ID}';"
