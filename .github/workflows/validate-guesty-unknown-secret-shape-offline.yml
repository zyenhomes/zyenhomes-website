name: Validate Guesty Unknown Secret Shape (Offline)
on:
  pull_request:
    paths:
      - 'scripts/inspect-guesty-secret-response.mjs'
      - 'scripts/validate-guesty-unknown-secret-shape-offline.mjs'
      - '.github/workflows/validate-guesty-unknown-secret-shape-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/inspect-guesty-secret-response.mjs
      - run: node scripts/validate-guesty-unknown-secret-shape-offline.mjs
