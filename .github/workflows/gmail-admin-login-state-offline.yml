name: Gmail Admin Login State Adapter (Offline)

on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/admin-login-state-adapter.js'
      - 'gmail-archive-oauth/d1-oauth-sessions.js'
      - 'gmail-archive-oauth/token-crypto.js'
      - 'scripts/test-gmail-admin-login-state-adapter.mjs'
      - '.github/workflows/gmail-admin-login-state-offline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-state-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate encrypted login state (offline only)
        run: node --experimental-default-type=module scripts/test-gmail-admin-login-state-adapter.mjs
