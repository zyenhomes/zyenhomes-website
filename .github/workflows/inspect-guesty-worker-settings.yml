name: Inspect Guesty Worker Production Bindings (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: guesty-webhook-activation
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Cloudflare production Worker settings without writes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/inspect-guesty-worker-settings.mjs
