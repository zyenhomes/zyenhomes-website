name: Validate Gmail D1 Migration Target (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/wrangler.toml'
      - 'gmail-archive-oauth/migrations/**'
      - 'scripts/test-gmail-d1-migration-target.mjs'
      - '.github/workflows/test-gmail-d1-migration-target.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-d1-migration-target.mjs
