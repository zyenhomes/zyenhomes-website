name: Validate Guesty Live Readiness Audit
on:
  pull_request:
    paths:
      - "docs/guesty-live-readiness-audit.md"
      - "scripts/validate-guesty-live-readiness-audit.mjs"
      - ".github/workflows/validate-guesty-live-readiness-audit.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-guesty-live-readiness-audit.mjs
