name: Diagnose Guesty Quotes (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare property quote responses
        run: node scripts/diagnose-guesty-quotes.mjs
