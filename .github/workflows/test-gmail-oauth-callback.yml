name: Validate Gmail OAuth Callback Orchestration (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/oauth-callback-flow.js'
      - 'scripts/test-gmail-oauth-callback.mjs'
      - '.github/workflows/test-gmail-oauth-callback.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-oauth-callback.mjs
