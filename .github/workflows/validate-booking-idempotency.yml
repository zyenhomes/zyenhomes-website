name: Validate Booking Idempotency
on:
  pull_request:
    paths:
      - 'cloudflare/worker.js'
      - 'scripts/validate-booking-idempotency.mjs'
      - '.github/workflows/validate-booking-idempotency.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-booking-idempotency.mjs
