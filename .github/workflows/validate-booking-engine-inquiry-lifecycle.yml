name: Validate Booking Engine Inquiry Lifecycle
on:
  pull_request:
    paths:
      - "cloudflare/guesty-booking-engine-inquiry-lifecycle.js"
      - "scripts/validate-booking-engine-inquiry-lifecycle-offline.mjs"
      - ".github/workflows/validate-booking-engine-inquiry-lifecycle.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-booking-engine-inquiry-lifecycle-offline.mjs
