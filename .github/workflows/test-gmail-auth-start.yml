name: Validate Gmail OAuth Authorization Start (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/google-auth-start.js'
      - 'scripts/test-gmail-auth-start.mjs'
      - '.github/workflows/test-gmail-auth-start.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-auth-start.mjs
