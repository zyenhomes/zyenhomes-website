name: Validate Booking Request Transport (Offline)
on:
  pull_request:
    paths:
      - "booking-request-transport.mjs"
      - "scripts/validate-booking-request-transport-offline.mjs"
      - ".github/workflows/validate-booking-request-transport-offline.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-booking-request-transport-offline.mjs
