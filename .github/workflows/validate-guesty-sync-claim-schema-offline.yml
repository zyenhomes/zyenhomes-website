name: Validate Guesty Sync Claim Schema (Offline)
on:
  pull_request:
    paths:
      - 'cloudflare/migrations/0004_guesty_inquiry_sync_claims.sql'
      - 'scripts/guesty-sync-claim-sql-offline.mjs'
      - 'scripts/validate-guesty-sync-claim-schema-offline.mjs'
      - '.github/workflows/validate-guesty-sync-claim-schema-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate offline schema and SQL guards
        run: |
          node --check scripts/guesty-sync-claim-sql-offline.mjs
          node --check scripts/validate-guesty-sync-claim-schema-offline.mjs
          node scripts/validate-guesty-sync-claim-schema-offline.mjs
