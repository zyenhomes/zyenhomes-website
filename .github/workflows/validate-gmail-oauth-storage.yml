name: Validate Gmail OAuth Storage Schema (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/migrations/**'
      - 'scripts/test-gmail-oauth-storage-schema.mjs'
      - '.github/workflows/validate-gmail-oauth-storage.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-oauth-storage-schema.mjs
