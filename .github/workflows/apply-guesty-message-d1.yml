name: Apply Guesty Message Archive Migration
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_GUESTY_MESSAGE_ARCHIVE to approve production D1 schema update"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zyenhomes-booking-d1-migrations
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - name: Require exact approval and validate schema offline
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "APPLY_GUESTY_MESSAGE_ARCHIVE" || { echo "Confirmation missing or incorrect"; exit 1; }
          python3 scripts/test-guesty-d1-migration.py
          grep -q 'GUESTY_WEBHOOKS_ENABLED = "false"' cloudflare/wrangler.toml
          grep -q 'BOOKING_REQUESTS_ENABLED = "false"' cloudflare/wrangler.toml
      - name: Install Wrangler 4
        run: npm install --no-save wrangler@4
      - name: Validate Cloudflare account configuration
        env:
          ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e '
            import {appendFileSync} from "node:fs";
            const id=(process.env.ACCOUNT_ID_RAW||"").trim();
            if(!/^[0-9a-fA-F]{32}$/.test(id))throw Error("Invalid account ID");
            appendFileSync(process.env.GITHUB_ENV,"CLOUDFLARE_ACCOUNT_ID="+id+"\n");
          '
      - name: Apply reviewed message archive migration to remote D1
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ../node_modules/.bin/wrangler d1 migrations apply zyenhomes-booking-requests --remote --config wrangler.toml
      - name: Verify new table exists (read only)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "SELECT name FROM sqlite_master WHERE type='table' AND name='guesty_message_events';"
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "SELECT COUNT(*) AS archived_message_count FROM guesty_message_events;"
