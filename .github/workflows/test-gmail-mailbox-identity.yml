name: Validate Gmail Mailbox Identity (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/mailbox-identity.js'
      - 'scripts/test-gmail-mailbox-identity.mjs'
      - '.github/workflows/test-gmail-mailbox-identity.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-mailbox-identity.mjs
