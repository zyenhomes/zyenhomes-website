name: Validate Gmail Token Encryption (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/token-crypto.js'
      - 'scripts/test-gmail-token-crypto.mjs'
      - '.github/workflows/validate-gmail-token-crypto.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-token-crypto.mjs
