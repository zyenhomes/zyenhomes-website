name: Validate Gmail Integrated Admin Login Guards (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/protected-admin-login-start.js'
      - 'scripts/test-gmail-integrated-admin-guards.mjs'
      - '.github/workflows/test-gmail-integrated-admin-guards.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-integrated-admin-guards.mjs
