name: Optimize property photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - 'scripts/optimize_images.py'
permissions:
  contents: write
concurrency:
  group: image-optimization
  cancel-in-progress: false
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install Pillow==11.3.0
      - name: Create WebP copies and update website
        run: python scripts/optimize_images.py
      - name: Commit optimized images and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Optimize property images for faster loading"
            git push
          fi
