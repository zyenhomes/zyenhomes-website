name: Validate Cloudflare Credential Shape Diagnostic (Offline)
on:
  pull_request:
    paths:
      - 'scripts/check-cloudflare-production-credential-shape.mjs'
      - '.github/workflows/check-cloudflare-production-credential-shape.yml'
      - 'scripts/validate-cloudflare-credential-shape-offline.mjs'
      - '.github/workflows/validate-cloudflare-credential-shape-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/check-cloudflare-production-credential-shape.mjs
      - run: node scripts/validate-cloudflare-credential-shape-offline.mjs
