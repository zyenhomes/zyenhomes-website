name: Deploy Reviewed Guesty Worker Version (Explicit Approval)
on:
  workflow_dispatch:
    inputs:
      candidate_version_id:
        description: "Exact reviewed candidate Worker version UUID"
        required: true
        type: string
      expected_active_version_id:
        description: "Exact currently active Worker version UUID"
        required: true
        type: string
      version_preflight_approved:
        description: "Confirm independent production binding/flag/code review of candidate"
        required: true
        type: boolean
        default: false
      confirmation:
        description: "Type DEPLOY_REVIEWED_GUESTY_VERSION to authorize 100% production deployment"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zyenhomes-booking-api-production
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_REVIEWED_GUESTY_VERSION' && inputs.version_preflight_approved == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@4
      - name: Promote exact reviewed version
        env:
          CANDIDATE_VERSION_ID: ${{ inputs.candidate_version_id }}
          EXPECTED_ACTIVE_VERSION_ID: ${{ inputs.expected_active_version_id }}
          VERSION_PREFLIGHT_APPROVED: ${{ inputs.version_preflight_approved }}
          DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-reviewed-guesty-version.mjs
