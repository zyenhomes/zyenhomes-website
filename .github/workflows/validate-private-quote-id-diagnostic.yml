name: Validate Private Quote ID Diagnostic
on:
  pull_request:
    paths:
      - "cloudflare/private-quote-id-diagnostic.js"
      - "cloudflare/worker.js"
      - "scripts/validate-private-quote-id-diagnostic-offline.mjs"
      - ".github/workflows/validate-private-quote-id-diagnostic.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-private-quote-id-diagnostic-offline.mjs
