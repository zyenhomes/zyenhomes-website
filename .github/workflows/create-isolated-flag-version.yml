name: Create Isolated Webhook Flag Version (Explicit Approval)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "VERIFY_DISABLED_RUNTIME_V2 or UPLOAD_ONE_DISABLED_ISOLATED_VERSION followed by the approved commit SHA"
        required: true
        type: string
permissions: {}
jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/fast-track/nonblocking-inquiry' && inputs.confirmation == 'VERIFY_DISABLED_RUNTIME_V2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: guesty-webhook-activation
    steps:
      - name: Verify active version and disabled runtime
        env:
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_ISOLATED_UPLOAD_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,re,urllib.request,urllib.error
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          def request(url,method="GET",headers=None):
              label=("Cloudflare API" if headers else "Worker")+" "+method+" "+url.rsplit("/",1)[-1]
              req=urllib.request.Request(url,method=method,headers={"User-Agent":"ZyenHomes-Runtime-Smoke/1.0","Accept":"application/json",**(headers or {})},data=b"" if method=="POST" else None)
              try:
                  response=opener.open(req,timeout=15)
              except urllib.error.HTTPError as e:
                  response=e
              with response as r:
                  status=r.code
                  kind=r.headers.get_content_type()
                  raw=r.read(65537)
                  print(f"{label}: HTTP {status}; content type {kind}; bytes {len(raw)}",flush=True)
                  if len(raw)>65536: raise SystemExit("Response too large")
                  try: payload=json.loads(raw)
                  except (ValueError,UnicodeError): raise SystemExit("Non-JSON response; stopping safely")
                  return status,payload
          account=os.environ["CF_ACCOUNT"]
          assert re.fullmatch(r"[a-fA-F0-9]{32}",account)
          api="https://api.cloudflare.com/client/v4/accounts/"+account+"/workers/scripts/zyenhomes-guesty-auth-test-isolated2"
          headers={"Authorization":"Bearer "+os.environ["CF_TOKEN"]}
          candidate="27eadf90-91a5-4da7-a917-1bc934a2d979"
          def traffic():
              status,j=request(api+"/deployments",headers=headers)
              assert status==200 and j["success"] is True
              rows=j["result"]
              if isinstance(rows,dict): rows=rows["deployments"]
              versions=max(rows,key=lambda x:x["created_on"])["versions"]
              assert len(versions)==1 and versions[0]["version_id"]==candidate and versions[0]["percentage"]==100
          traffic()
          status,j=request(api+"/versions/"+candidate,headers=headers)
          assert status==200 and j["success"] is True
          bindings={b["name"]:b for b in j["result"]["resources"]["bindings"]}
          assert bindings["GUESTY_ISOLATED_INQUIRY_TEST_ENABLED"]["text"]=="false"
          print("PASS: exact active candidate at 100% and inquiry flag disabled")
          base="https://zyenhomes-guesty-auth-test-isolated2.brendan-nguyen-90f.workers.dev"
          assert request(base+"/")== (200,{"status":"running","mode":"isolated_candidate","liveWritesEnabled":False,"databaseWritesEnabled":False})
          assert request(base+"/internal/inquiry-test")== (403,{"success":False,"code":"ISOLATED_WRITES_DISABLED"})
          assert request(base+"/internal/inquiry-test","POST")== (403,{"success":False,"code":"LIVE_TEST_DISABLED"})
          traffic()
          print("PASS: root status, GET rejection, empty POST rejection, unchanged active traffic")
          PY
  upload:
    if: ${{ github.ref == 'refs/heads/fast-track/nonblocking-inquiry' && github.run_attempt == '1' && startsWith(inputs.confirmation, 'UPLOAD_ONE_DISABLED_ISOLATED_VERSION ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: guesty-webhook-activation
    permissions:
      contents: read
    concurrency:
      group: zyenhomes-nonblocking-isolated-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify explicit commit approval
        env:
          APPROVAL: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$APPROVAL" = "UPLOAD_ONE_DISABLED_ISOLATED_VERSION $(git rev-parse HEAD)"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Offline regression tests
        run: |
          node scripts/validate-nonblocking-upload-preflight.mjs
          node scripts/validate-nonblocking-version-upload.mjs

      - name: Install pinned Wrangler
        run: npm install --no-save --no-package-lock wrangler@4.168.0

      - name: Upload exactly one disabled isolated version
        env:
          TEST_CONFIRMATION: UPLOAD_ONE_DISABLED_ISOLATED_VERSION
          APPROVED_COMMIT: ${{ github.sha }}
          APPROVED_ACTIVE_VERSION: 27eadf90-91a5-4da7-a917-1bc934a2d979
          APPROVED_LATEST_VERSION: 27eadf90-91a5-4da7-a917-1bc934a2d979
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ISOLATED_UPLOAD_TOKEN }}
        run: node scripts/nonblocking-version-upload.mjs
