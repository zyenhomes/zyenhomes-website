name: Create Isolated Webhook Flag Version (Explicit Approval)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DIAGNOSE_ISOLATED_READ_ONLY
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    if: ${{ github.ref == 'refs/heads/fast-track/nonblocking-inquiry' && inputs.confirmation == 'DIAGNOSE_ISOLATED_READ_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: guesty-webhook-activation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 080c8ac2e1e6928be7c6280d4818f6d3840775b7
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only endpoint diagnostics
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/inspect-nonblocking-isolated-target.mjs
