name: Create Isolated Webhook Flag Version (Explicit Approval)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY_UPLOADED_VERSION_READ_ONLY
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: ${{ github.ref == 'refs/heads/fast-track/nonblocking-inquiry' && inputs.confirmation == 'VERIFY_UPLOADED_VERSION_READ_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: guesty-webhook-activation
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 74f36a96ecec88e131547f0e4c0abe3cd1397472
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing candidate (GET only)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_ISOLATED_UPLOAD_TOKEN }}
        run: node scripts/verify-nonblocking-uploaded-version.mjs
