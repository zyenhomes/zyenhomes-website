name: Create Isolated Webhook Flag Version (Explicit Approval)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type VERIFY_ISOLATED_TOKEN_READ_ONLY
        required: true
        type: string
permissions: {}
jobs:
  isolated-token:
    if: ${{ github.ref == 'refs/heads/fast-track/nonblocking-inquiry' && inputs.confirmation == 'VERIFY_ISOLATED_TOKEN_READ_ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: guesty-webhook-activation
    steps:
      - name: Verify token and account access (GET only)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_ISOLATED_UPLOAD_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, json, re
          token=os.environ.get("CF_TOKEN","")
          account=os.environ.get("CF_ACCOUNT","")
          if not token or not re.fullmatch(r"[a-fA-F0-9]{32}",account):
              print("Missing token or account configuration")
              raise SystemExit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect())
          failed=False
          for label,path in [
              ("Token verification","/user/tokens/verify"),
              ("Worker account access",f"/accounts/{account}/workers/scripts/zyenhomes-guesty-auth-test-isolated2/deployments"),
              ("D1 account access",f"/accounts/{account}/d1/database/ca5a1af6-6ad5-4c6c-a4aa-ee75ecd0158e")]:
              try:
                  req=urllib.request.Request("https://api.cloudflare.com/client/v4"+path,headers={"Authorization":"Bearer "+token},method="GET")
                  with opener.open(req,timeout=15) as response:
                      payload=json.load(response)
                      ok=payload.get("success") is True
                      if label=="Token verification": ok=ok and payload.get("result",{}).get("status")=="active"
                      print(f"{label}: HTTP {response.status}; {'PASS' if ok else 'FAIL'}")
                      failed |= not ok
              except urllib.error.HTTPError as e:
                  print(f"{label}: HTTP {e.code}; FAIL")
                  failed=True
              except Exception:
                  print(f"{label}: request failed")
                  failed=True
          raise SystemExit(int(failed))
          PY
