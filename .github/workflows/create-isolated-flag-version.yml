name: Create Isolated Webhook Flag Version (Explicit Approval)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CREATE_ONE_ISOLATED_FLAG_VERSION to authorize one undeployed test Worker version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zyenhomes-isolated-flag-version
  cancel-in-progress: false
jobs:
  create:
    if: ${{ inputs.confirmation == 'CREATE_ONE_ISOLATED_FLAG_VERSION' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: guesty-webhook-activation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save wrangler@4
      - name: Create one isolated undeployed test version
        env:
          TEST_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/create-isolated-flag-version.mjs
