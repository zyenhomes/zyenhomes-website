name: Validate Guesty Request Identity Mapping
on:
  pull_request:
    paths:
      - "cloudflare/guesty-request-identity-mapping.js"
      - "scripts/validate-guesty-request-identity-mapping-offline.mjs"
      - ".github/workflows/validate-guesty-request-identity-mapping.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-guesty-request-identity-mapping-offline.mjs
