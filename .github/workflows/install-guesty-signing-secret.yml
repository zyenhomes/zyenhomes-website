name: Install Guesty Webhook Signing Secret (Manual Approval)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type INSTALL_GUESTY_SIGNING_SECRET only after subscription exists and procedure approved"
        required: true
        type: string
      subscription_verified:
        description: "Confirm exact endpoint subscription exists and its identity was independently checked"
        required: true
        default: false
        type: boolean
      secret_schema_verified:
        description: "Confirm actual Guesty secret JSON shape and signature format were independently verified"
        required: true
        default: false
        type: boolean
      isolated_worker_verified:
        description: "Confirm separately reviewed isolated Worker secret-put test (not production)"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: guesty-message-subscription-creation
  cancel-in-progress: false
jobs:
  install:
    if: ${{ inputs.confirmation == 'INSTALL_GUESTY_SIGNING_SECRET' && inputs.isolated_worker_verified == true && inputs.subscription_verified == true && inputs.secret_schema_verified == true }}
    runs-on: ubuntu-latest
    environment: guesty-webhook-activation
    steps:
      - uses: actions/checkout@v4
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Secure Guesty signing secret installation
        env:
          HANDOFF_CONFIRMATION: ${{ inputs.confirmation }}
          ISOLATED_WORKER_SECRET_PUT_VERIFIED: ${{ inputs.isolated_worker_verified }}
          GUESTY_SUBSCRIPTION_VERIFIED: ${{ inputs.subscription_verified }}
          GUESTY_SECRET_SCHEMA_VERIFIED: ${{ inputs.secret_schema_verified }}
          GUESTY_OPEN_API_CLIENT_ID: ${{ secrets.GUESTY_OPEN_API_CLIENT_ID }}
          GUESTY_OPEN_API_CLIENT_SECRET: ${{ secrets.GUESTY_OPEN_API_CLIENT_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/install-guesty-signing-secret.mjs
