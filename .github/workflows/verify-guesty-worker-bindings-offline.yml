name: Verify Guesty Worker Bindings (Offline)
on:
  pull_request:
    paths:
      - 'scripts/verify-guesty-worker-bindings-offline.mjs'
      - 'cloudflare/wrangler.toml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/verify-guesty-worker-bindings-offline.mjs
