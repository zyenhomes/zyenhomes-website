name: Validate Guesty Handoff Consolidated (Offline)
on:
  pull_request:
    paths:
      - 'scripts/install-guesty-signing-secret.mjs'
      - 'scripts/test-guesty-secret-handoff-failclosed.mjs'
      - 'scripts/test-guesty-subscription-identity-offline.mjs'
      - 'scripts/validate-guesty-oauth-429-offline.mjs'
      - 'scripts/validate-guesty-open-api-token-reuse-offline.mjs'
      - 'scripts/validate-guesty-secret-key-parser-offline.mjs'
      - '.github/workflows/validate-guesty-handoff-consolidated-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check installer syntax
        run: node --check scripts/install-guesty-signing-secret.mjs
      - name: Validate handoff fail-closed gates
        run: node scripts/test-guesty-secret-handoff-failclosed.mjs
      - name: Validate subscription identity
        run: node scripts/test-guesty-subscription-identity-offline.mjs
      - name: Validate Guesty OAuth 429 handling
        run: node scripts/validate-guesty-oauth-429-offline.mjs
      - name: Validate Guesty Open API token reuse
        run: node scripts/validate-guesty-open-api-token-reuse-offline.mjs
      - name: Validate Guesty secret key parser
        run: node scripts/validate-guesty-secret-key-parser-offline.mjs
