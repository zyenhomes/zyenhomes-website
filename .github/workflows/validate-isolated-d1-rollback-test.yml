name: Validate Isolated D1 Rollback Test Worker
on:
  pull_request:
    paths:
      - "cloudflare/isolated-d1-rollback-test-standalone.js"
      - "scripts/validate-isolated-d1-rollback-test.mjs"
      - ".github/workflows/validate-isolated-d1-rollback-test.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-isolated-d1-rollback-test.mjs
