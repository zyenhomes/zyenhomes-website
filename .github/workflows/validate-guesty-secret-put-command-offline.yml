name: Validate Guesty Secret Put Command (Offline)
on:
  pull_request:
    paths:
      - 'scripts/test-guesty-secret-put-command-offline.mjs'
      - 'scripts/install-guesty-signing-secret.mjs'
      - '.github/workflows/install-guesty-signing-secret.yml'
      - '.github/workflows/validate-guesty-secret-put-command-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-guesty-secret-put-command-offline.mjs
