name: Validate Guesty Quote Contract Diagnostics
on:
  pull_request:
    paths:
      - "cloudflare/guesty-quote-contract-diagnostic.js"
      - "scripts/validate-guesty-quote-contract-diagnostic-offline.mjs"
      - ".github/workflows/validate-guesty-quote-contract-diagnostic.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-guesty-quote-contract-diagnostic-offline.mjs
