name: Apply Isolated Booking Migration 0001
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLY_BOOKING_0001 to approve production D1 reconciliation"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zyenhomes-booking-d1-migrations
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - name: Confirm approval, isolated SQL and disabled features
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$CONFIRMATION" = "APPLY_BOOKING_0001"
          cmp cloudflare/migrations/0001_booking_requests.sql cloudflare/reconcile-0001/0001_booking_requests.sql
          test "$(find cloudflare/reconcile-0001 -name '*.sql' | wc -l)" -eq 1
          grep -q 'migrations_dir = "reconcile-0001"' cloudflare/wrangler.reconcile-0001.toml
          grep -q 'GUESTY_WEBHOOKS_ENABLED = "false"' cloudflare/wrangler.toml
          grep -q 'BOOKING_REQUESTS_ENABLED = "false"' cloudflare/wrangler.toml
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Validate Cloudflare account
        env:
          RAW_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e '
            import {appendFileSync} from "node:fs";
            const id=(process.env.RAW_ID||"").trim();
            if(!/^[a-fA-F0-9]{32}$/.test(id))throw Error("Invalid account ID");
            appendFileSync(process.env.GITHUB_ENV,"CLOUDFLARE_ACCOUNT_ID="+id+"\n");
          '
      - name: Fail-closed production schema preflight
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ../scripts/verify-booking-d1-before-0001.mjs
      - name: Apply only migration 0001 using isolated config
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ../node_modules/.bin/wrangler d1 migrations apply zyenhomes-booking-requests --remote --config wrangler.reconcile-0001.toml
      - name: Verify migration recorded and booking count after
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.reconcile-0001.toml --command "SELECT id,name FROM d1_migrations ORDER BY id;"
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.reconcile-0001.toml --command "SELECT COUNT(*) AS booking_count_after FROM booking_requests;"
          ../node_modules/.bin/wrangler d1 migrations list zyenhomes-booking-requests --remote --config wrangler.toml
