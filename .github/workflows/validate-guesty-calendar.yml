name: Validate Guesty Calendar Parser
on:
  pull_request:
    paths:
      - 'lib/guesty-calendar-status.mjs'
      - 'scripts/test-calendar-status.mjs'
      - '.github/workflows/validate-guesty-calendar.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-calendar-status.mjs
