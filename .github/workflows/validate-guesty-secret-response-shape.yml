name: Validate Guesty Secret Response Classifier (Offline)
on:
  pull_request:
    paths:
      - 'scripts/validate-guesty-secret-response-shape.mjs'
      - '.github/workflows/validate-guesty-secret-response-shape.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/validate-guesty-secret-response-shape.mjs
