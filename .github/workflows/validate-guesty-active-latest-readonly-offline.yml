name: Validate Guesty Active vs Latest Inspection (Offline)
on:
  pull_request:
    paths:
      - 'scripts/inspect-guesty-active-latest-versions-readonly.mjs'
      - '.github/workflows/inspect-guesty-active-latest-versions-readonly.yml'
      - 'scripts/validate-guesty-active-latest-readonly-offline.mjs'
      - '.github/workflows/validate-guesty-active-latest-readonly-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/inspect-guesty-active-latest-versions-readonly.mjs
      - run: node scripts/validate-guesty-active-latest-readonly-offline.mjs
