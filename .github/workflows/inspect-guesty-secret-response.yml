name: Inspect Guesty Signing Secret Response (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: guesty-open-api-readonly
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Guesty signing-secret response shape only
        env:
          GUESTY_OPEN_API_CLIENT_ID: ${{ secrets.GUESTY_OPEN_API_CLIENT_ID }}
          GUESTY_OPEN_API_CLIENT_SECRET: ${{ secrets.GUESTY_OPEN_API_CLIENT_SECRET }}
        run: node scripts/inspect-guesty-secret-response.mjs
