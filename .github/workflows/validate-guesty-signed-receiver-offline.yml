name: Validate Guesty Signed Receiver (Offline)
on:
  pull_request:
    paths:
      - 'scripts/test-guesty-signed-receiver-offline.mjs'
      - 'cloudflare/guesty-webhooks.js'
      - '.github/workflows/validate-guesty-signed-receiver-offline.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-guesty-signed-receiver-offline.mjs
