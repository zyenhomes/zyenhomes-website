name: Validate Guesty D1 Atomic Claim Batch Plan (Offline)
on:
  pull_request:
    paths:
      - 'scripts/guesty-d1-atomic-claim-batch-offline.mjs'
      - 'scripts/validate-guesty-d1-atomic-claim-batch-offline.mjs'
      - 'scripts/guesty-sync-claim-sql-offline.mjs'
      - '.github/workflows/validate-guesty-d1-atomic-claim-batch-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check and run isolated SQL batch plan tests
        run: |
          node --check scripts/guesty-d1-atomic-claim-batch-offline.mjs
          node --check scripts/validate-guesty-d1-atomic-claim-batch-offline.mjs
          node scripts/validate-guesty-d1-atomic-claim-batch-offline.mjs
