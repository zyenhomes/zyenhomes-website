name: Initialize Zyen Homes Booking Database
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zyenhomes-booking-d1-migrations
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - name: Verify D1 configuration and migration
        run: |
          test -s cloudflare/migrations/0001_booking_requests.sql
          grep -q 'binding = "BOOKING_DB"' cloudflare/wrangler.toml
      - name: Install current Wrangler CLI
        run: npm install --no-save wrangler@4

      - name: Validate Cloudflare Account ID without exposing it
        env:
          ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          node --input-type=module -e '
            import { appendFileSync } from "node:fs";
            const raw=process.env.ACCOUNT_ID_RAW ?? "";
            const clean=raw.trim();
            console.log("Account ID length:", clean.length);
            console.log("Leading or trailing whitespace:", raw!==clean ? "present" : "none");
            console.log("Hexadecimal format:", /^[0-9a-fA-F]{32}$/.test(clean) ? "valid" : "invalid");
            if(!/^[0-9a-fA-F]{32}$/.test(clean)) {
              console.error("Cloudflare Account ID must be exactly 32 hexadecimal characters.");
              process.exit(1);
            }
            appendFileSync(process.env.GITHUB_ENV, "CLOUDFLARE_ACCOUNT_ID="+clean+"\\n");
          '

      - name: Show remote migration state (read only)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ../node_modules/.bin/wrangler --version
          ../node_modules/.bin/wrangler d1 migrations list zyenhomes-booking-requests --remote --config wrangler.toml

      - name: Apply reviewed migration to remote D1
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ../node_modules/.bin/wrangler d1 migrations apply zyenhomes-booking-requests --remote --config wrangler.toml
