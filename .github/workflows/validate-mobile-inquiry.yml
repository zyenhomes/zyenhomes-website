name: Validate Mobile Calendar and Inquiry
on:
  pull_request:
    paths:
      - 'property.html'
      - 'zyen-connected-calendar.js'
      - 'zyen-116-calendar-pilot.js'
      - 'scripts/validate-mobile-inquiry.mjs'
      - '.github/workflows/validate-mobile-inquiry.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-mobile-inquiry.mjs
