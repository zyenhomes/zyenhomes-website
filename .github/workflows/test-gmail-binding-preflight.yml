name: Validate Gmail OAuth Binding Preflight (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/binding-preflight.js'
      - 'scripts/test-gmail-binding-preflight.mjs'
      - '.github/workflows/test-gmail-binding-preflight.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-binding-preflight.mjs
