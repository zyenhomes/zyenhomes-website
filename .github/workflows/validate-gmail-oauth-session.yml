name: Validate Gmail OAuth One-Time Sessions (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/oauth-session.js'
      - 'scripts/test-gmail-oauth-session.mjs'
      - '.github/workflows/validate-gmail-oauth-session.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-oauth-session.mjs
