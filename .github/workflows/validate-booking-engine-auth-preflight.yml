name: Validate Booking Engine Internal Auth Preflight
on:
  pull_request:
    paths:
      - "cloudflare/guesty-booking-engine-auth-preflight.js"
      - "scripts/validate-booking-engine-auth-preflight-offline.mjs"
      - ".github/workflows/validate-booking-engine-auth-preflight.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-booking-engine-auth-preflight-offline.mjs
