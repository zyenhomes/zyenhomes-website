name: Validate Guesty OAuth Explicit Opt-In (Offline)
on:
  pull_request:
    paths:
      - 'scripts/install-guesty-signing-secret.mjs'
      - '.github/workflows/install-guesty-signing-secret.yml'
      - 'scripts/validate-guesty-oauth-optin-offline.mjs'
      - '.github/workflows/validate-guesty-oauth-optin-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/install-guesty-signing-secret.mjs
      - run: node scripts/validate-guesty-oauth-optin-offline.mjs
