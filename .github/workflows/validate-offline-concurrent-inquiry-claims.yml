name: Validate Offline Concurrent Inquiry Claims
on:
  pull_request:
    paths:
      - "scripts/test-offline-concurrent-inquiry-claims.py"
      - "cloudflare/migrations/**"
      - ".github/workflows/validate-offline-concurrent-inquiry-claims.yml"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test-offline-concurrent-inquiry-claims.py
