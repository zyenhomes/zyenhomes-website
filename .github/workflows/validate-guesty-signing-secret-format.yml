name: Validate Guesty Signing Secret Handoff Format (Offline)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate synthetic signing secret response handling
        run: node scripts/validate-guesty-signing-secret-format.mjs
