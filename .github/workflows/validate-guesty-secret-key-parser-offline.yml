name: Validate Guesty Secret Key Parser (Offline)
on:
  pull_request:
    paths:
      - 'scripts/install-guesty-signing-secret.mjs'
      - 'scripts/validate-guesty-secret-key-parser-offline.mjs'
      - '.github/workflows/validate-guesty-secret-key-parser-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/install-guesty-signing-secret.mjs
      - run: node scripts/validate-guesty-secret-key-parser-offline.mjs
