name: Sync Guesty Reviews
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * *'
permissions:
  contents: write
concurrency:
  group: guesty-reviews-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch verified reviews from Guesty
        env:
          GUESTY_CLIENT_ID: ${{ secrets.GUESTY_CLIENT_ID }}
          GUESTY_CLIENT_SECRET: ${{ secrets.GUESTY_CLIENT_SECRET }}
        run: python scripts/sync_guesty_reviews.py
      - name: Commit updated reviews if changed
        run: |
          git add data/guesty-reviews.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Sync verified Guesty guest reviews'
            git push
          fi
