name: Validate Gmail Administrator Sessions (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/admin-session.js'
      - 'scripts/test-gmail-admin-session.mjs'
      - '.github/workflows/test-gmail-admin-session.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-admin-session.mjs
