name: Preflight Guesty Message Archive D1 (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zyenhomes-booking-d1-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - name: Validate migration offline
        run: |
          python3 scripts/test-guesty-d1-migration.py
          test -s cloudflare/migrations/0002_guesty_message_events.sql
          grep -q 'GUESTY_WEBHOOKS_ENABLED = "false"' cloudflare/wrangler.toml
          grep -q 'BOOKING_REQUESTS_ENABLED = "false"' cloudflare/wrangler.toml
      - name: Install Wrangler 4
        run: npm install --no-save wrangler@4
      - name: Validate Cloudflare account configuration
        env:
          ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e '
            import {appendFileSync} from "node:fs";
            const id=(process.env.ACCOUNT_ID_RAW||"").trim();
            if(!/^[0-9a-fA-F]{32}$/.test(id))throw Error("Invalid Cloudflare Account ID format");
            appendFileSync(process.env.GITHUB_ENV,"CLOUDFLARE_ACCOUNT_ID="+id+"\n");
            console.log("Cloudflare account configuration format OK");
          '
      - name: Inspect remote D1 migration state (read only)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: ../node_modules/.bin/wrangler d1 migrations list zyenhomes-booking-requests --remote --config wrangler.toml
      - name: Inspect remote D1 tables and counts (read only)
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "SELECT name,type FROM sqlite_master WHERE type IN ('table','view') ORDER BY name;"
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "SELECT COUNT(*) AS booking_request_count FROM booking_requests;"
