name: Validate Booking API Changes

on:
  pull_request:
    paths:
      - "cloudflare/**"
      - ".github/workflows/deploy-booking-api.yml"
      - ".github/workflows/validate-booking-api.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Worker syntax
        run: node --check cloudflare/worker.js
      - name: Validate Wrangler configuration without deployment
        run: |
          npx --yes wrangler@4 deploy --dry-run --config cloudflare/wrangler.toml
