name: Preflight Guesty Message Subscription (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    environment: guesty-open-api-readonly
    steps:
      - uses: actions/checkout@v4
      - name: Confirm no existing Guesty webhook subscriptions
        env:
          GUESTY_OPEN_API_CLIENT_ID: ${{ secrets.GUESTY_OPEN_API_CLIENT_ID }}
          GUESTY_OPEN_API_CLIENT_SECRET: ${{ secrets.GUESTY_OPEN_API_CLIENT_SECRET }}
        run: node scripts/preflight-guesty-message-subscription.mjs
