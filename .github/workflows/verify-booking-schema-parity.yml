name: Verify Existing Booking D1 Schema (Read Only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: cloudflare-production
    steps:
      - uses: actions/checkout@v4
      - name: Check migration locally
        run: python3 scripts/test-guesty-d1-migration.py
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Validate Cloudflare account ID
        env:
          RAW_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module -e '
            import {appendFileSync} from "node:fs";
            const id=(process.env.RAW_ID||"").trim();
            if(!/^[a-fA-F0-9]{32}$/.test(id))throw Error("Invalid account ID");
            appendFileSync(process.env.GITHUB_ENV,"CLOUDFLARE_ACCOUNT_ID="+id+"\n");
          '
      - name: Inspect existing remote schema and indexes without writes
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "SELECT type,name,tbl_name,sql FROM sqlite_master WHERE (tbl_name='booking_requests' OR name='marketing_opt_ins') AND type IN ('table','index','view') ORDER BY type,name;"
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "PRAGMA table_info('booking_requests');"
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "PRAGMA index_list('booking_requests');"
          ../node_modules/.bin/wrangler d1 execute zyenhomes-booking-requests --remote --config wrangler.toml --command "SELECT id,name,applied_at FROM d1_migrations ORDER BY id;"
