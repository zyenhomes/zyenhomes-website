name: Validate Disabled Booking Engine Worker Route
on:
  pull_request:
    paths:
      - "cloudflare/guesty-booking-engine-route.js"
      - "scripts/validate-booking-engine-disabled-route-offline.mjs"
      - ".github/workflows/validate-booking-engine-disabled-route.yml"
      - "cloudflare/worker.js"
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate-booking-engine-disabled-route-offline.mjs
