name: Validate Reviewed Guesty Deployment (Offline)
on:
  pull_request:
    paths:
      - 'scripts/deploy-reviewed-guesty-version.mjs'
      - 'scripts/validate-reviewed-guesty-deploy-offline.mjs'
      - '.github/workflows/deploy-reviewed-guesty-version.yml'
      - '.github/workflows/validate-reviewed-guesty-deploy-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check scripts/deploy-reviewed-guesty-version.mjs
      - run: node scripts/validate-reviewed-guesty-deploy-offline.mjs
