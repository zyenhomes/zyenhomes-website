name: Validate Staged D1 Guest Form
on:
  pull_request:
    paths:
      - 'zyen-connected-calendar.js'
      - 'zyen-116-calendar-pilot.js'
      - 'scripts/validate-staged-d1-form.mjs'
      - '.github/workflows/validate-staged-d1-form.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-staged-d1-form.mjs
