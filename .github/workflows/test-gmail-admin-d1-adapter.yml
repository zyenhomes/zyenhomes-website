name: Validate Gmail Admin D1 Adapter (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/d1-admin-session-adapter.js'
      - 'scripts/test-gmail-admin-d1-adapter.mjs'
      - '.github/workflows/test-gmail-admin-d1-adapter.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-admin-d1-adapter.mjs
