name: Validate Guesty Activation Gates (Offline)
on:
  pull_request:
    paths:
      - 'docs/guesty-webhook-enabled-rollout-gates.md'
      - 'scripts/validate-guesty-activation-gates-offline.mjs'
      - '.github/workflows/validate-guesty-activation-gates-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-guesty-activation-gates-offline.mjs
