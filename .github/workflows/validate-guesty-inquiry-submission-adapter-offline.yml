name: Validate Guesty Inquiry Submission Adapter (Offline)
on:
  pull_request:
    paths:
      - 'scripts/guesty-inquiry-submission-adapter-offline.mjs'
      - 'scripts/validate-guesty-inquiry-submission-adapter-offline.mjs'
      - 'scripts/build-guesty-inquiry-request-offline.mjs'
      - '.github/workflows/validate-guesty-inquiry-submission-adapter-offline.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test offline inquiry submission contract
        run: |
          node --check scripts/guesty-inquiry-submission-adapter-offline.mjs
          node --check scripts/validate-guesty-inquiry-submission-adapter-offline.mjs
          node scripts/validate-guesty-inquiry-submission-adapter-offline.mjs
