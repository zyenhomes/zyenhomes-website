name: Validate Gmail OAuth Security Primitives (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/**'
      - 'scripts/test-gmail-oauth-security.mjs'
      - '.github/workflows/validate-gmail-oauth-security.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-gmail-oauth-security.mjs
