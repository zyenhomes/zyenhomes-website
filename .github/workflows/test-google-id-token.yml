name: Validate Google ID Token Signature (Offline)
on:
  pull_request:
    paths:
      - 'gmail-archive-oauth/google-id-token.js'
      - 'scripts/test-google-id-token.mjs'
      - '.github/workflows/test-google-id-token.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-google-id-token.mjs
