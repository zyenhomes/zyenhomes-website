name: Test Wrangler Secret Preservation (Isolated Worker Only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type TEST_ISOLATED_WORKER_ONLY to test only zyenhomes-webhook-test"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: zyenhomes-isolated-wrangler-secret-test
  cancel-in-progress: false
jobs:
  test:
    if: ${{ inputs.confirmation == 'TEST_ISOLATED_WORKER_ONLY' }}
    runs-on: ubuntu-latest
    environment: guesty-webhook-activation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Wrangler CLI
        run: npm install --no-save wrangler@4
      - name: Install fictional secret into isolated Worker and verify preservation
        env:
          TEST_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/test-isolated-wrangler-secret.mjs
