name: Inspect Guesty Version Code Metadata (Read Only)
on:
  workflow_dispatch:
    inputs:
      active_version_id:
        description: Full active Worker version UUID
        required: true
        type: string
      candidate_version_id:
        description: Full undeployed Worker version UUID
        required: true
        type: string
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: guesty-webhook-activation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect version metadata only
        env:
          ACTIVE_VERSION_ID: ${{ inputs.active_version_id }}
          CANDIDATE_VERSION_ID: ${{ inputs.candidate_version_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/inspect-guesty-version-code-metadata-readonly.mjs
