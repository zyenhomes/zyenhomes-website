<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property Details | Zyen Homes</title><link rel="stylesheet" href="styles.css"><style>
.zy-wrap{max-width:1180px;margin:50px auto 90px;padding:0 22px}.zy-title{font-size:clamp(32px,4vw,52px);color:#153e35;margin:12px 0}.zy-sub{color:#596761;line-height:1.65}.zy-form{display:flex;gap:12px;flex-wrap:wrap;padding:20px;background:#f3f6f3;border-radius:14px;margin:25px 0}.zy-form label{display:flex;flex-direction:column;gap:6px;font-weight:600;color:#24473e;flex:1;min-width:155px}.zy-form input{padding:13px;border:1px solid #cad4cc;border-radius:8px;font:inherit}.zy-button{display:inline-block;background:#174f41;color:#fff;border:0;padding:14px 24px;border-radius:7px;text-decoration:none;cursor:pointer;font:inherit}.zy-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.zy-card{border:1px solid #e0e8e2;border-radius:14px;overflow:hidden;background:white}.zy-card img{width:100%;height:225px;object-fit:cover}.zy-card-body{padding:20px}.zy-card h2{font-size:23px;color:#173d32;margin:8px 0}.zy-muted{color:#596a61}.zy-tag{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#27634c}.zy-notice{padding:16px 18px;border-left:3px solid #1a5947;background:#f2f6f2;margin:22px 0;color:#244638}.zy-back{color:#215846;text-decoration:none}.zy-detail{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;align-items:start}.zy-detail img{width:100%;border-radius:15px;object-fit:cover;max-height:480px}.zy-detail h1{margin:12px 0}.zy-foot{padding:30px;text-align:center;background:#153e35;color:white}.zy-foot a{color:white}@media(max-width:850px){.zy-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.zy-detail{grid-template-columns:1fr}}@media(max-width:550px){.zy-grid{grid-template-columns:1fr}.zy-form{display:block}.zy-form label{margin:0 0 12px}.zy-form input{width:100%;box-sizing:border-box}}
 .zy-gallery{margin:28px 0 38px}.zy-gallery-main{width:100%;height:clamp(260px,50vw,580px);object-fit:cover;border-radius:14px;display:block;background:#edf0ed}.zy-gallery-thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-top:10px}.zy-gallery-thumbs button{padding:0;border:2px solid transparent;background:none;border-radius:8px;overflow:hidden;cursor:pointer}.zy-gallery-thumbs button.active{border-color:#174f41}.zy-gallery-thumbs img{width:100%;height:95px;object-fit:cover;display:block}.zy-gallery-status{color:#596a61;margin:10px 0}.zy-gallery-count{margin:10px 0;color:#596a61;font-size:13px}@media(max-width:600px){.zy-gallery-thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}.zy-gallery-thumbs img{height:70px}}</style></head><body><header class="site-header"><a class="brand brand-logo" href="index.html"><img src="Zyen Homes Logo(2).jpg" alt="Zyen Homes"></a><nav><a href="index.html">Home</a><a href="rentals.html">All Properties</a><a href="custom-stay.html">Custom Stay</a></nav></header><main class="zy-wrap"><a class="zy-back" href="rentals.html">← All Properties</a><div id="property"></div></main><footer class="zy-foot">Zyen Homes Property Management · <a href="mailto:info@zyenhomes.com">Contact Us</a></footer><script src="properties-data.js"></script><script>
const q=new URLSearchParams(location.search),x=ZYEN_PROPERTIES.find(x=>x.id===q.get('id')),root=document.querySelector('#property');if(!x){root.innerHTML='<h1>Property not found</h1><a href="rentals.html">View all properties</a>'}else{document.title=x.name+' | Zyen Homes';const subject=encodeURIComponent('Booking inquiry: '+x.name),details=encodeURIComponent('Hello Zyen Homes,\n\nI would like to inquire about '+x.name+'.\nCheck-in: '+(q.get('checkin')||'Flexible')+'\nCheck-out: '+(q.get('checkout')||'Flexible')+'\nGuests: '+(q.get('guests')||'Please advise')+'\n\nPlease confirm availability and pricing.');root.innerHTML='<section id="live-gallery" class="zy-gallery" aria-label="Property photo gallery"><p class="zy-gallery-status">Loading photos from Guesty…</p></section><div class="zy-detail"><img src="'+encodeURI(x.image)+'" alt="'+x.name+'" id="detail-photo"><div><p class="zy-tag">'+x.location+'</p><h1 class="zy-title">'+x.name+'</h1><p class="zy-sub">'+x.beds+' bedrooms · '+x.baths+' bathrooms · Sleeps '+x.guests+'</p><p>'+x.feature+'</p><div class="zy-notice"><strong>Booking integration in progress.</strong><p>Live availability, final pricing and online payments are not yet enabled. Contact our team for a confirmed quote.</p></div><a class="zy-button" href="mailto:info@zyenhomes.com?subject='+subject+'&body='+details+'">Request Availability & Pricing</a><p class="zy-muted">We will confirm your dates and total before any reservation is made.</p></div></div>'}

// Live Guesty photo gallery for the connected property. Never expose Guesty credentials here.
if(x && x.id==='116-tyrolean'){
  const gallery=document.getElementById('live-gallery');
  const endpoint='https://zyenhomes-api.brendan-nguyen-90f.workers.dev/api/property/116-tyrolean';
  fetch(endpoint,{headers:{Accept:'application/json'}})
    .then(async response=>{if(!response.ok) throw new Error('Photos unavailable');return response.json()})
    .then(data=>{
      const items=Array.isArray(data.photos?.photos)?data.photos.photos:[];
      const photos=items.filter(p=>typeof(p.original||p.source)==='string' && /^https:\/\//.test(p.original||p.source)).sort((a,b)=>(a.index??0)-(b.index??0));
      if(!photos.length) throw new Error('No photos returned');
      gallery.replaceChildren();
      const main=document.createElement('img');
      main.className='zy-gallery-main';main.alt=x.name+' property photo';main.loading='eager';
      const counter=document.createElement('p');counter.className='zy-gallery-count';
      const thumbs=document.createElement('div');thumbs.className='zy-gallery-thumbs';
      function show(index){
        main.src=photos[index].original||photos[index].source;
        main.alt=x.name+' — photo '+(index+1);
        counter.textContent='Photo '+(index+1)+' of '+photos.length+' · Updated from Guesty';
        thumbs.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('active',i===index);b.setAttribute('aria-pressed',String(i===index))});
      }
      photos.forEach((photo,i)=>{
        const button=document.createElement('button');button.type='button';button.setAttribute('aria-label','View photo '+(i+1));
        const image=document.createElement('img');image.src=photo.thumbnail||photo.original||photo.source;image.alt='Photo '+(i+1);image.loading='lazy';
        button.appendChild(image);button.addEventListener('click',()=>show(i));thumbs.appendChild(button);
      });
      gallery.append(main,counter,thumbs);show(0);
      const detail=document.getElementById('detail-photo');
      if(detail) detail.src=photos[0].original||photos[0].source;
    })
    .catch(()=>{
      gallery.innerHTML='<p class="zy-gallery-status">The live photo gallery is temporarily unavailable. The property details are still available below.</p>';
    });
}
</script></body></html>
