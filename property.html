e may be arranged for an additional fee with substantial advance notice; availability is not guaranteed.</p><h2>Year-Round Hot Tub &amp; SwimSpa</h2><div class=\"zy-amenity-grid\"><div class=\"zy-amenity-group\"><h3>Hot Tub Section</h3><ul><li>Seats approximately 6–8 guests</li><li>Maintained at approximately 102°F year-round</li></ul></div><div class=\"zy-amenity-group\"><h3>SwimSpa / Pool Section</h3><ul><li>Separately controlled temperature</li><li>Approximately 102°F in winter</li><li>Approximately 80°F in summer for heated-pool lounging</li></ul></div></div><h2>Sleeping Arrangements &amp; Floor Layout</h2><div class=\"zy-amenity-grid\"><div class=\"zy-amenity-group\"><h3>Second Floor</h3><ul><li>Large kitchen, espresso and drip coffee station</li><li>Two dining areas seating over 20</li><li>Bedroom 1: King bed and ensuite bathroom</li><li>Bedroom 2: King bed</li><li>Bedroom 3: Two Queen beds</li><li>One additional shared full bathroom</li><li>Upper deck with outdoor seating and large BBQ</li></ul></div><div class=\"zy-amenity-group\"><h3>Main Floor</h3><ul><li>Two shared full bathrooms</li><li>Bedroom 4: Queen bed</li><li>Bedroom 5: Queen bed</li><li>Bedroom 6: King bed</li><li>Bedroom 7: Queen bed</li><li>Bedroom 8: Queen and Twin beds</li><li>Deck with seating and gas fire table</li><li>Access to Hot Tub/SwimSpa</li><li>130-inch projector and screen</li><li>Air hockey table</li></ul></div><div class=\"zy-amenity-group\"><h3>Basement</h3><ul><li>Bedroom 9: Two Queen beds</li><li>One shared full bathroom</li><li>Pool table, foosball, TV and seating area</li><li>Oversized sauna with rinse station</li></ul></div></div><h2>Included in Your Stay</h2><div class=\"zy-amenity-grid\"><div class=\"zy-amenity-group\"><h3>Essentials</h3><ul><li>Bed linens and one bath towel per guest</li><li>Coffee, espresso, tea and basic cooking essentials</li><li>Netflix accounts on the home's TVs</li></ul></div><div class=\"zy-amenity-group\"><h3>Entertainment &amp; Outdoors</h3><ul><li>Board games</li><li>BBQ grill (weather and season permitting)</li><li>Private backyard (not fenced between neighbours)</li></ul></div><div class=\"zy-amenity-group\"><h3>EV Charging</h3><ul><li>EV charging outlet available</li><li>Guests must bring their own compatible charger</li></ul></div></div><h2>Important Guest Information</h2><div class=\"zy-highlight\"><p>The home is in a rural, natural setting. Insects or bugs may occasionally be encountered indoors or outdoors despite regular cleaning and maintenance.</p><p>Electricity, water, gas, internet, air conditioning, heating, snow conditions, ski hill operations and other third-party or seasonal services can sometimes be interrupted for reasons outside our control. Please contact us promptly if an issue arises; applicable guest rights and legal obligations continue to apply.</p><p><strong>Short-Term Accommodation Licence:</strong> LCSTR20220000203</p></div></section>":'')+''}

  const photos=filenames.map(name=>({

  }));

  const main=document.getElementById('detail-photo');
  const counter=document.createElement('p');

    counter.textContent='Photo '+(index+1)+' of '+photos.length;

  photos.forEach((photo,i)=>{

    button.setAttribute('aria-label','View photo '+(i+1));
