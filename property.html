<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property Details | Zyen Homes</title><link rel="stylesheet" href="styles.css"><style>
.site-header{position:relative;background:#153e35;color:#fff}.site-header nav a{color:#fff}.zy-wrap{max-width:1180px;margin:50px auto 90px;padding:0 22px}.zy-title{font-size:clamp(32px,4vw,52px);color:#153e35;margin:12px 0}.zy-sub{color:#596761;line-height:1.65}.zy-form{display:flex;gap:12px;flex-wrap:wrap;padding:20px;background:#f3f6f3;border-radius:14px;margin:25px 0}.zy-form label{display:flex;flex-direction:column;gap:6px;font-weight:600;color:#24473e;flex:1;min-width:155px}.zy-form input{padding:13px;border:1px solid #cad4cc;border-radius:8px;font:inherit}.zy-button{display:inline-block;background:#174f41;color:#fff;border:0;padding:14px 24px;border-radius:7px;text-decoration:none;cursor:pointer;font:inherit}.zy-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.zy-card{border:1px solid #e0e8e2;border-radius:14px;overflow:hidden;background:white}.zy-card img{width:100%;height:225px;object-fit:cover}.zy-card-body{padding:20px}.zy-card h2{font-size:23px;color:#173d32;margin:8px 0}.zy-muted{color:#596a61}.zy-tag{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#27634c}.zy-notice{padding:16px 18px;border-left:3px solid #1a5947;background:#f2f6f2;margin:22px 0;color:#244638}.zy-back{color:#215846;text-decoration:none}.zy-detail{display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:start;margin-top:25px}.zy-detail img{width:100%;height:clamp(280px,38vw,490px);border-radius:15px;object-fit:cover}.zy-detail h1{margin:12px 0}.zy-foot{padding:30px;text-align:center;background:#153e35;color:white}.zy-foot a{color:white}@media(max-width:850px){.zy-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.zy-detail{grid-template-columns:1fr}}@media(max-width:550px){.zy-grid{grid-template-columns:1fr}.zy-form{display:block}.zy-form label{margin:0 0 12px}.zy-form input{width:100%;box-sizing:border-box}}
 .zy-gallery{margin:22px 0 38px}.zy-gallery-main{width:100%;height:clamp(260px,50vw,580px);object-fit:cover;border-radius:14px;display:block;background:#edf0ed}.zy-gallery-thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-top:10px}.zy-gallery-thumbs button{padding:0;border:2px solid transparent;background:none;border-radius:8px;overflow:hidden;cursor:pointer}.zy-gallery-thumbs button.active{border-color:#174f41}.zy-gallery-thumbs img{width:100%;height:95px;object-fit:cover;display:block}.zy-gallery-status{color:#596a61;margin:10px 0}.zy-gallery-count{margin:10px 0;color:#596a61;font-size:13px}@media(max-width:600px){.zy-gallery-thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}.zy-gallery-thumbs img{height:70px}}.zy-info{margin:44px 0 55px}.zy-info h2{font-family:Georgia,serif;font-size:clamp(28px,3vw,38px);color:#153e35;margin:0 0 16px}.zy-info-intro{font-size:16px;line-height:1.8;color:#4b5c54;max-width:940px}.zy-amenity-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:22px}.zy-amenity-group{padding:22px;border:1px solid #e0e8e2;border-radius:14px;background:#f8faf8}.zy-amenity-group h3{font-size:18px;color:#153e35;margin:0 0 16px}.zy-amenity-group ul{padding:0;margin:0;list-style:none}.zy-amenity-group li{padding:8px 0;border-bottom:1px solid #e5eae5;font-size:14px;color:#374a40}.zy-amenity-group li:last-child{border:0}.zy-amenity-group li:before{content:"✓";color:#17684d;font-weight:bold;margin-right:10px}.zy-draft-note{font-size:12px;color:#69776e;margin-top:16px}@media(max-width:760px){.zy-amenity-grid{grid-template-columns:1fr}.zy-info{margin:34px 0}}</style></head><body><header class="site-header"><a class="brand brand-logo" href="index.html"><img src="Zyen Homes Logo(2).jpg" alt="Zyen Homes"></a><nav><a href="index.html">Home</a><a href="rentals.html">All Properties</a><a href="custom-stay.html">Custom Stay</a></nav></header><main class="zy-wrap"><a class="zy-back" href="rentals.html">← Al const q=new URLSearchParams(location.search),x=ZYEN_PROPERTIES.find(x=>x.id===q.get('id')),root=document.querySelector('#property');if(!x){root.innerHTML='<h1>Property not found</h1><a href="rentals.html">View all properties</a>'}else{document.title=x.name+' | Zyen Homes';const subject=encodeURIComponent('Booking inquiry: '+x.name),details=encodeURIComponent('Hello Zyen Homes,\n\nI would like to inquire about '+x.name+'.\nCheck-in: '+(q.get('checkin')||'Flexible')+'\nCheck-out: '+(q.get('checkout')||'Flexible')+'\nGuests: '+(q.get('guests')||'Please advise')+'\n\nPlease confirm availability and pricing.');root.innerHTML='<div class="zy-detail"><img src="'+encodeURI(x.image)+'" alt="'+x.name+'" id="detail-photo"><div><p class="zy-tag">'+x.location+'</p><h1 class="zy-title">'+x.name+'</h1><p class="zy-sub">'+x.beds+' bedrooms · '+x.baths+' bathrooms · Sleeps '+x.guests+'</p><p>'+x.feature+'</p><div class="zy-notice"><strong>Booking integration in progress.</strong><p>Live availability, final pricing and online payments are not yet enabled. Contact our team for a confirmed quote.</p></div><a class="zy-button" href="mailto:info@zyenhomes.com?subject='+subject+'&body='+details+'">Request Availability & Pricing</a><p class="zy-muted">We will confirm your dates and total before any reservation is made.</p></div></div><section id="live-gallery" class="zy-gallery" aria-label="Property photo gallery"></section>'+(x.id==='116-tyrolean'?'<section class="zy-info"><h2>About This Chalet</h2><p class="zy-info-intro">Experience a spacious Blue Mountains getaway designed for large families and groups. Featuring nine bedrooms, five bathrooms, and accommodations for up to 20 guests, this chalet offers plenty of room to relax, reconnect, and enjoy a memorable vacation. Unwind in the large outdoor swimspa, enjoy time together in the entertainment areas, and discover the Blue Mountains throughout all four seasons.</p><h2>Amenities &amp; Features</h2><div class="zy-amenity-grid"><div class="zy-amenity-group"><h3>Outdoor &amp; Relaxation</h3><ul><li>Large outdoor hot tub / swimspa</li><li>Outdoor deck</li><li>BBQ</li></ul></div><div class="zy-amenity-group"><h3>Entertainment</h3><ul><li>Pool table</li><li>Foosball table</li><li>Air hockey</li><li>Home theatre / projector</li><li>Board games</li></ul></div><div class="zy-amenity-group"><h3>Comfort &amp; Convenience</h3><ul><li>Wi-Fi</li><li>Fully equipped kitchen</li><li>Air conditioning</li><li>Heating</li><li>Washer and dryer</li><li>Free parking</li></ul></div></div><p class="zy-draft-note">Amenities shown are a draft and subject to confirmation.</p></section>':'')+''}

if(x && x.id==='116-tyrolean'){
  const gallery=document.getElementById('live-gallery');
  const filenames=["6.jpg","10.jpg","11.jpg","116 Tyrolean Lane Web (12).jpg","116 Tyrolean Lane Web (14).jpg","116 Tyrolean Lane Web (15).jpg","116 Tyrolean Lane Web (17).jpg","116 Tyrolean Lane Web (18).jpg","116 Tyrolean Lane Web (20).jpg","116 Tyrolean Lane Web (21).jpg","116 Tyrolean Lane Web (22).jpg","116 Tyrolean Lane Web (23).jpg","116 Tyrolean Lane Web (24).jpg","116 Tyrolean Lane Web (30).jpg","116 Tyrolean Lane Web (31).jpg","116 Tyrolean Lane Web (33).jpg","116 Tyrolean Lane Web (34).jpg","116 Tyrolean Lane Web (35).jpg","116 Tyrolean Lane Web (36).jpg","116 Tyrolean Lane Web (4).jpg","116 Tyrolean Lane Web (49).jpg","116 Tyrolean Lane Web (51).jpg","116 Tyrolean Lane Web (53).jpg","116 Tyrolean Lane Web (60).jpg","116 Tyrolean Lane Web (62).jpg","116 Tyrolean Lane Web (64).jpg","116 Tyrolean Lane Web (67).jpg","116 Tyrolean Lane Web (8).jpg","12.jpg","13.jpg","14.jpg","15.jpg","16.jpg","17.jpg","18.jpg","20.jpg","21.jpg","22.jpg","23.jpg","3.jpg","5.jpg","8.jpg","9.jpg","20250929_164056.jpg","20250929_164227.jpg","20250930_221623.jpg","20250930_221816.jpg","20250930_222110.jpg","Advertisement pic (5).png","Cosy Modern Football Home Cinema.png","Sunlit Garden Swim Spa Deck.png"];
  const photos=filenames.map(name=>({
    url:'property-photos/116-tyrolean/'+encodeURIComponent(name),
    name
  }));
  gallery.replaceChildren();
  const main=document.getElementById('detail-photo');
  const counter=document.createElement('p');
  counter.className='zy-gallery-count';
  const thumbs=document.createElement('div');
  thumbs.className='zy-gallery-thumbs';
  function show(index){
    main.src=photos[index].url;
    main.alt=x.name+' — photo '+(index+1);
    counter.textContent='Photo '+(index+1)+' of '+photos.length;
    thumbs.querySelectorAll('button').forEach((b,i)=>{
      b.classList.toggle('active',i===index);
      b.setAttribute('aria-pressed',String(i===index));
    });
  }
  photos.forEach((photo,i)=>{
    const button=document.createElement('button');
    button.type='button';
    button.setAttribute('aria-label','View photo '+(i+1));
    const image=document.createElement('img');
    image.src=photo.url;image.alt='Photo '+(i+1);image.loading='lazy';
    button.appendChild(image);
    button.addEventListener('click',()=>show(i));
    thumbs.appendChild(button);
  });
  gallery.append(counter,thumbs);
  show(0);

}
</script></body></html>
