  let photos=[];
  const urlFor=name=>x.id==='940-seven-oaks'?'property-photos/940-Sevenoaks/'+encodeURIComponent(name):'property-photos/'+(x.id==='147-campbell'?'147-Campbell':x.id)+'/'+encodeURIComponent(name);
  const tabs=document.createElement('div');
  tabs.className='zy-gallery-tabs';
  gallery.appendChild(tabs);
  function selectCategory(category){
    photos=categories[category].map(name=>({url:urlFor(name),name}));
    [...tabs.children].forEach(button=>{const active=button.textContent===category;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));});
    if(!photos.length){main.src=encodeURI(x.image);main.alt=x.name;counter.textContent='Photos coming soon';return;}
    show(0);
  }
  Object.keys(categories).forEach(category=>{
    const button=document.createElement('button');button.type='button';
    button.textContent=category;button.setAttribute('aria-pressed','false');
    button.addEventListener('click',()=>selectCategory(category));tabs.appendChild(button);
  });

  const main=document.getElementById('detail-photo');
  const frame=document.getElementById('photo-frame');
  const prev=document.createElement('button');
  const next=document.createElement('button');
  const counter=document.createElement('span');
  prev.type=next.type='button';
  prev.className='zy-photo-arrow zy-photo-prev';
  next.className='zy-photo-arrow zy-photo-next';
  prev.textContent='‹';next.textContent='›';
  prev.setAttribute('aria-label','Previous photo');
  next.setAttribute('aria-label','Next photo');
  counter.className='zy-photo-counter';
  counter.setAttribute('aria-live','polite');
  let current=0;
  function show(index){
    current=(index+photos.length)%photos.length;
    main.src=photos[current].url;
    main.alt=x.name+' — photo '+(current+1);
    counter.textContent=(current+1)+' / '+photos.length;
  }
  prev.addEventListener('click',()=>show(current-1));
  next.addEventListener('click',()=>show(current+1));
  let touchX=null;
  frame.addEventListener('touchstart',event=>{
    touchX=event.changedTouches[0].screenX;
  },{passive:true});
  frame.addEventListener('touchend',event=>{
    if(touchX===null)return;
    const distance=event.changedTouches[0].screenX-touchX;
    touchX=null;
    if(Math.abs(distance)>45)show(current+(distance<0?1:-1));
  },{passive:true});
  frame.append(prev,next,counter);
  selectCategory('Featured Photos');

}
